<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520">
  <rect width="900" height="520" fill="white"/>
  <text x="450" y="35" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold">ESP32 Dino Game — Circuit / Pin Map</text>

  <rect x="80" y="100" width="260" height="300" rx="18" fill="#eeeeee" stroke="#222" stroke-width="3"/>
  <text x="210" y="140" text-anchor="middle" font-family="Arial" font-size="25" font-weight="bold">ESP32</text>
  <text x="210" y="175" text-anchor="middle" font-family="Arial" font-size="16">Main Controller</text>
  <text x="105" y="215" font-family="Arial" font-size="15">GPIO 18  — SCK</text>
  <text x="105" y="245" font-family="Arial" font-size="15">GPIO 19  — MISO</text>
  <text x="105" y="275" font-family="Arial" font-size="15">GPIO 23  — MOSI</text>
  <text x="105" y="305" font-family="Arial" font-size="15">GPIO 15  — TFT CS</text>
  <text x="105" y="335" font-family="Arial" font-size="15">GPIO 2   — TFT DC</text>
  <text x="105" y="365" font-family="Arial" font-size="15">GPIO 4   — TFT RST</text>

  <rect x="560" y="100" width="260" height="300" rx="18" fill="#eeeeee" stroke="#222" stroke-width="3"/>
  <text x="690" y="140" text-anchor="middle" font-family="Arial" font-size="25" font-weight="bold">ILI9341</text>
  <text x="690" y="175" text-anchor="middle" font-family="Arial" font-size="16">240 × 320 TFT</text>
  <text x="585" y="215" font-family="Arial" font-size="15">SCK / CLK</text>
  <text x="585" y="245" font-family="Arial" font-size="15">SDO / MISO</text>
  <text x="585" y="275" font-family="Arial" font-size="15">SDI / MOSI</text>
  <text x="585" y="305" font-family="Arial" font-size="15">CS</text>
  <text x="585" y="335" font-family="Arial" font-size="15">DC / RS</text>
  <text x="585" y="365" font-family="Arial" font-size="15">RST</text>
  <text x="585" y="395" font-family="Arial" font-size="15">VCC / GND → 3.3V / GND</text>

  <line x1="340" y1="210" x2="560" y2="210" stroke="#333" stroke-width="3"/>
  <line x1="340" y1="240" x2="560" y2="240" stroke="#333" stroke-width="3"/>
  <line x1="340" y1="270" x2="560" y2="270" stroke="#333" stroke-width="3"/>
  <line x1="340" y1="300" x2="560" y2="300" stroke="#333" stroke-width="3"/>
  <line x1="340" y1="330" x2="560" y2="330" stroke="#333" stroke-width="3"/>
  <line x1="340" y1="360" x2="560" y2="360" stroke="#333" stroke-width="3"/>

  <rect x="355" y="430" width="190" height="60" rx="12" fill="#e8e8e8" stroke="#222" stroke-width="2"/>
  <text x="450" y="455" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">Push Button</text>
  <text x="450" y="478" text-anchor="middle" font-family="Arial" font-size="14">GPIO 14 ↔ Button ↔ GND</text>

  <text x="450" y="510" text-anchor="middle" font-family="Arial" font-size="13">Button uses INPUT_PULLUP; pressed = LOW</text>
</svg>
