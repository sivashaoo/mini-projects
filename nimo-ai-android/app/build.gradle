plugins {
    id 'com.android.application'
}
android {
    namespace 'com.nimo.ai'
    compileSdk 35
    defaultConfig {
        applicationId 'com.nimo.ai'
        minSdk 26
        targetSdk 28
        versionCode 2
        versionName '0.2.0'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17 -O2'
                arguments '-DANDROID_STL=c++_shared'
            }
    }
    }
    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }
}
